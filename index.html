<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contador</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>Pomodoro</h1>
        <div class="timer">
           <div id="display">
                00:00:00
           </div>
           <div class="modal-editar" id="modalEditar">
               <div class="modal-conteudo">
                   <div class="editar-tempo" id="editarTempo"> 
                       <label for="worktime">Tempo de Estudos (minutos): </label>
                       <input type="number" id="workTimeEdit" min="1" max="120" value="25">
                       <label for="resttime">Tempo de Descanso (minutos): </label>
                       <input type="number" id="restTimeEdit" min="1" max="60" value="6">
                       <button type="button" id="fecharModal">Fechar</button>
                   </div>
               </div>
           </div>
            <div class="botoes"> 
                <button type="button" id="start">COMEÇAR</button>
                <button type="button" id="pause">PAUSAR</button>
                <button type="button" id="reset">RESET</button>
            </div>
            <div id="rodadas">
                #1
            </div>
        </div>
    </div>

    <script src="main.js"></script>
</body>
</html>
