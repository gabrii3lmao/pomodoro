<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contador</title>
    <link rel="stylesheet" href="style.css">
     <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="container">

<div class="borda">
        <h1>Pomodoro</h1>
        <div class="timer">
           <div id="display">
                00:00:00
                <audio src="audios/alarm.mp3" id="audioAlarm" preload="auto"></audio>
           </div>
           <div class="situacao" id="situacaoId">
            
           </div>
           
           <!-- Modal para editar tempo -->
           <div class="modal-editar" id="modalEditar">
               <div class="modal-conteudo">
                   <div class="editar-tempo" id="editarTempo"> 
                       <label for="worktime">Tempo de Estudos (minutos): </label>
                       <input type="number" id="workTimeEdit" min="1" max="120" placeholder="min 1 max 120">
                       <label for="resttime">Tempo de Descanso (minutos): </label>
                       <input type="number" id="restTimeEdit" min="1" max="60" placeholder="min 1 max 60">
                       <button type="button" id="fecharModal">Fechar</button>
                   </div>
               </div>
           </div>
           
            <div class="botoes"> 
                <button type="button" id="start">COMEÇAR</button>
                <audio src="audios/click.mp3" id="audioClick" preload="auto"></audio>
                <button type="button" id="pause">PAUSAR</button>
                <button type="button" id="reset">RESET</button>
            </div>
            <div id="rodadas">
                #1
            </div>
        </div>
       </div>
    </div>
     <h1>feito com amor e carinho</h1>
    <script src="main.js"></script>
</body>
</html>
